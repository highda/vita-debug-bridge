# vdb configuration, read at boot. One setting per line; a later line
# overrides an earlier one; unknown lines are ignored (noted in boot.txt).
usb on            # take the USB port once the shell is up (off: leave it to the system)
awake off         # keep-awake while the bridge runs: off | standby | screen
hooks on          # touch injection, the overlay and printf capture; or one by one:
# touch off
# display off
# printf off
